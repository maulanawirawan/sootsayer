[package]
name = "sootsayer-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Haze-to-clinic-load outlook engine for Sootsayer (native CLI + WebAssembly)."
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "sootsayer"
path = "src/bin/sootsayer.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
