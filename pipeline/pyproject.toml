[project]
name = "sootsayer-pipeline"
version = "0.1.0"
description = "Builds Sootsayer's static reference data and replay snapshots from open sources."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "shapely>=2.0",
]

[project.optional-dependencies]
ads = [
    "ecmwf-datastores-client>=0.6.0",
    "netcdf4>=1.7.5.1.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sootsayer_pipeline"]
