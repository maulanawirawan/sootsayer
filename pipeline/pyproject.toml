[project]
name = "sootsayer-pipeline"
version = "0.1.0"
description = "Builds Sootsayer's static reference data and replay snapshots from open sources."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sootsayer_pipeline"]
